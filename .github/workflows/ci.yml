name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      # Type-check for every platform we ship on. Platform-specific APIs such
      # as os.startfile and ctypes.windll only exist on some platforms, so
      # checking a single platform would hide real errors on the others.
      - name: Mypy (type check, Linux)
        run: mypy --platform linux

      - name: Mypy (type check, Windows)
        run: mypy --platform win32

      - name: Mypy (type check, macOS)
        run: mypy --platform darwin

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Fail fast rather than block a runner for hours if a UI test hangs.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-tk xvfb

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unit tests (pytest)
        if: runner.os != 'Linux'
        run: python -m pytest -q

      - name: Unit tests (pytest, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m pytest -q

      - name: Unit tests (unittest)
        if: runner.os != 'Linux'
        run: python -m unittest discover -q

      - name: Unit tests (unittest, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m unittest discover -q

      - name: Application self-check
        run: python main.py --check

  launch:
    name: Native launch · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-tk xvfb

      - name: Launch the desktop application
        if: runner.os != 'Linux'
        run: python tools/smoke_launch.py

      - name: Launch the desktop application (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python tools/smoke_launch.py
