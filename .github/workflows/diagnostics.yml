name: Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-ui:
    name: macOS UI diagnostics
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Non-UI tests
        run: >-
          python -m pytest -v --timeout=60
          tests
          --ignore=tests/test_ui_dialogs.py
          --ignore=tests/test_ui_smoke.py

      - name: UI smoke tests
        run: python -m pytest -v --timeout=60 tests/test_ui_smoke.py

      - name: UI dialog tests
        run: python -m pytest -v --timeout=60 tests/test_ui_dialogs.py
