[project]
name = "opsflow-desktop"
version = "1.1.0"
description = "Offline operations, SLA and escalation desktop application built with Python, Tkinter and SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["tkinter", "desktop", "sla", "ticketing", "sqlite", "operations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# OpsFlow intentionally depends on the Python standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
opsflow = "main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "BLE",   # flake8-blind-except
    "RUF",   # ruff-specific rules
]
ignore = [
    # The ttk widget tree is built with long, explicit pack/grid option lists;
    # splitting them hurts readability more than it helps.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# UI layers intentionally catch broad exceptions: every one of them is a
# user-facing error boundary that surfaces a message box and keeps the app
# alive, rather than a silent failure.
"ui/*.py" = ["BLE001"]
# Test helpers and the CLI entry point intentionally accept loose inputs.
"tests/*.py" = ["BLE001"]
"main.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "database", "models", "services", "ui"]

[tool.mypy]
python_version = "3.11"
files = [
    "config.py",
    "database.py",
    "main.py",
    "models.py",
    "services",
    "ui",
    "tests",
]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tkinter.*"]
ignore_missing_imports = true
